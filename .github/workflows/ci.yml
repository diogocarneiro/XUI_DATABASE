name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core tests run offline and need only these — skip the heavy GUI dep.
          pip install PyMySQL sqlparse pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
