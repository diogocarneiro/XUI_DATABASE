name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # reused by the release workflow before building

jobs:
  test:
    # Pinned image: "ubuntu-latest" moves to new releases for which older Python
    # builds may not exist yet, which fails setup-python before any test runs.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false    # report every Python version instead of cancelling the rest
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Everything except the GUI toolkit: core, SSH and the offline test suite.
          python -m pip install PyMySQL paramiko pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
