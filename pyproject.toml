[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xui-db-tool"
dynamic = ["version"]
description = "GUI and CLI to inspect, back up, repair and migrate XUI / Xtream-UI / StreamCreed panel databases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diogo Carneiro", email = "diogoncarneiro@outlook.com" }]
keywords = ["xui", "xtream-ui", "streamcreed", "iptv", "mysql", "migration", "backup"]
# The CLI needs only these; the desktop GUI is the "gui" extra:
#   pip install xui-db-tool          (servers, headless)
#   pip install "xui-db-tool[gui]"   (desktop)
dependencies = [
    "PyMySQL>=1.1.0",
    "paramiko>=3.4",
]

[project.urls]
Homepage = "https://github.com/diogocarneiro/XUI_DATABASE"
Issues = "https://github.com/diogocarneiro/XUI_DATABASE/issues"

[project.scripts]
xui-db-tool = "xdbtool.__main__:main"

[project.optional-dependencies]
gui = ["PySide6>=6.7,<6.9"]
dev = ["pytest>=8.0", "ruff>=0.6", "pyinstaller>=6.6", "build>=1.2"]

[tool.setuptools.dynamic]
version = { attr = "xdbtool.__version__" }

[tool.setuptools.packages.find]
include = ["xdbtool*"]

[tool.setuptools.package-data]
xdbtool = ["data/*.json", "i18n/locales/*.json", "help/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from the checkout with plain `pytest` too (not only `python -m
# pytest`): without this the CI collected nothing and exited with code 2.
pythonpath = ["."]
